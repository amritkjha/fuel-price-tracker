
name: Daily Fuel Price Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update_data:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'

    - name: Check update schedule
      id: schedule_check
      run: |
        python - <<'PY'
        import random
        import os
        from datetime import datetime, timezone
        from zoneinfo import ZoneInfo

        if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
            should_run = True
        else:
            ist_now = datetime.now(timezone.utc).astimezone(
                ZoneInfo("Asia/Kolkata")
            )

            rng = random.Random(ist_now.date().isoformat())

            update_count = rng.choices(
                [1, 2, 3, 4],
                weights=[40, 40, 15, 5],
                k=1
            )[0]

            selected_hours = sorted(
                rng.sample(range(6, 24), update_count)
            )

            should_run = ist_now.hour in selected_hours

            print(f"Selected update hours (IST): {selected_hours}")

        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"should_run={str(should_run).lower()}\n")
        PY

    - name: Install dependencies
      if: steps.schedule_check.outputs.should_run == 'true'
      run: pip install -r requirements.txt

    - name: Run data fetch and update script
      if: steps.schedule_check.outputs.should_run == 'true'
      run: python fetch_fuel_data.py

    - name: Commit and push changes
      if: steps.schedule_check.outputs.should_run == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'Automated daily fuel price update'
        file_pattern: 'fuel_prices.csv'
        commit_user_name: 'github-actions[bot]'
        commit_user_email: 'github-actions[bot]@users.noreply.github.com'
        skip_dirty_check: false
